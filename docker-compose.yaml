# The `ia` CLI is a one-shot tool, not a daemon. Use `run`, not `up`:
#
#   docker compose run --rm ia configure
#   docker compose run --rm ia download nasa --glob='*.jpg'
#   docker compose run --rm ia metadata nasa
services:
  ia:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jeppestaerk/internetarchive-docker:latest
    environment:
      - TZ=${TZ:-Europe/Copenhagen}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Unset resolves to an empty string, which the library treats as absent
      # and falls through to /config/ia.ini.
      - IA_ACCESS_KEY_ID=${IA_ACCESS_KEY_ID:-}
      - IA_SECRET_ACCESS_KEY=${IA_SECRET_ACCESS_KEY:-}
    volumes:
      - ./downloads:/data
      - ia-config:/config

    # Hardening. The container starts as root only to chown /config and /data,
    # then su-execs down to PUID:PGID, so these three capabilities are the
    # complete set it needs - verified by running with each one removed.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN    # chown /config and /data to PUID:PGID
      - SETUID   # su-exec setuid
      - SETGID   # su-exec setgroups/setgid
    security_opt:
      - no-new-privileges:true
    # Nothing is written outside the two mounts. /tmp is tmpfs for anything
    # transient; PYTHONDONTWRITEBYTECODE keeps Python from writing .pyc files.
    read_only: true
    tmpfs:
      - /tmp

volumes:
  ia-config:
    driver: local
